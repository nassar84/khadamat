<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>خدماوي | KhadaMAWI</title>
    <base href="/" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap"
        rel="stylesheet">

    <!-- UI Frameworks/Libraries -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="_content/Khadamat.BlazorUI/css/khadamat.css?v=2029" />
    <link rel="stylesheet" href="_content/Khadamat.BlazorUI/css/app.css" />
    <link rel="stylesheet" href="lib/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="lib/swiper/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="icon" type="image/png" href="favicon.png?v=2" />
    <link href="Khadamat.WasmHost.styles.css" rel="stylesheet" />

    <style>
        body {
            font-family: 'Tajawal', 'Outfit', sans-serif;
            background-color: #f8fafc;
            color: var(--text-main);
            overflow-x: clip;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        #app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .loading-progress {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
        }

        .loading-progress circle {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 1, 200;
            stroke-dashoffset: 0;
            animation: dash 1.5s ease-in-out infinite;
        }

        @keyframes dash {
            0% {
                stroke-dasharray: 1, 200;
                stroke-dashoffset: 0;
            }

            50% {
                stroke-dasharray: 89, 200;
                stroke-dashoffset: -35;
            }

            100% {
                stroke-dasharray: 89, 200;
                stroke-dashoffset: -124;
            }
        }
    </style>
</head>

<body>
    <div id="app"></div>

    <div id="blazor-error-ui">
        حدث خطأ غير متوقع.
        <a href="." class="reload">إعادة تحميل</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="lib/swiper/swiper-bundle.min.js"></script>
    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/sounds.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.initCategoriesSlider = () => {
            const el = document.querySelector('.categories-swiper');
            if (!el) {
                console.warn("Categories slider element not found yet.");
                return;
            }

            if (typeof Swiper === 'undefined') {
                console.error("Swiper library not loaded.");
                return;
            }

            try {
                new Swiper('.categories-swiper', {
                    slidesPerView: 'auto',
                    spaceBetween: 0,
                    loop: true,
                    grabCursor: true,
                    freeMode: {
                        enabled: true,
                        momentumBounce: false,
                        momentumRatio: 1
                    },
                    speed: 3000,
                    autoplay: {
                        delay: 0,
                        disableOnInteraction: false,
                        pauseOnMouseEnter: true
                    },
                    mousewheel: {
                        forceToAxis: true,
                    },
                    touchStartPreventDefault: false,
                    simulateTouch: true,
                    shortSwipes: true,
                    longSwipes: true
                });
            } catch (e) {
                console.error("Swiper initialization failed:", e);
            }
        };

        // Drag to scroll for category marquee
        window.initCategoryDragScroll = (element) => {
            if (!element) return;

            let isDown = false;
            let startX;
            let scrollLeft;
            let velocity = 0;
            let momentumID;

            element.addEventListener('mousedown', (e) => {
                isDown = true;
                element.style.cursor = 'grabbing';
                startX = e.pageX - element.offsetLeft;
                scrollLeft = element.scrollLeft;
                cancelMomentumTracking();
            });

            element.addEventListener('mouseleave', () => {
                isDown = false;
                element.style.cursor = 'grab';
            });

            element.addEventListener('mouseup', () => {
                isDown = false;
                element.style.cursor = 'grab';
                beginMomentumTracking();
            });

            element.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - element.offsetLeft;
                const walk = (x - startX) * 2;
                const prevScrollLeft = element.scrollLeft;
                element.scrollLeft = scrollLeft - walk;
                velocity = element.scrollLeft - prevScrollLeft;
            });

            // Touch support
            element.addEventListener('touchstart', (e) => {
                isDown = true;
                startX = e.touches[0].pageX - element.offsetLeft;
                scrollLeft = element.scrollLeft;
                cancelMomentumTracking();
            });

            element.addEventListener('touchend', () => {
                isDown = false;
                beginMomentumTracking();
            });

            element.addEventListener('touchmove', (e) => {
                if (!isDown) return;
                const x = e.touches[0].pageX - element.offsetLeft;
                const walk = (x - startX) * 2;
                const prevScrollLeft = element.scrollLeft;
                element.scrollLeft = scrollLeft - walk;
                velocity = element.scrollLeft - prevScrollLeft;
            });

            function beginMomentumTracking() {
                cancelMomentumTracking();
                momentumID = requestAnimationFrame(momentumLoop);
            }

            function cancelMomentumTracking() {
                cancelAnimationFrame(momentumID);
            }

            function momentumLoop() {
                if (!element) return;
                element.scrollLeft -= velocity;
                velocity *= 0.95;
                if (Math.abs(velocity) > 0.5) {
                    momentumID = requestAnimationFrame(momentumLoop);
                }
            }
        };

        // Apply theme colors dynamically
        window.applyThemeColors = (primaryColor, secondaryColor) => {
            if (!primaryColor) return;

            try {
                document.documentElement.style.setProperty('--theme-primary', primaryColor);

                // Convert hex to RGB for glow effect
                let r, g, b;
                if (primaryColor.startsWith('#')) {
                    r = parseInt(primaryColor.slice(1, 3), 16);
                    g = parseInt(primaryColor.slice(3, 5), 16);
                    b = parseInt(primaryColor.slice(5, 7), 16);
                } else {
                    // Fallback to default if not hex
                    r = 99; g = 102; b = 241;
                }

                document.documentElement.style.setProperty('--theme-primary-rgb', `${r}, ${g}, ${b}`);
                document.documentElement.style.setProperty('--theme-glow', `rgba(${r}, ${g}, ${b}, 0.3)`);
                document.documentElement.style.setProperty('--theme-light', `rgba(${r}, ${g}, ${b}, 0.1)`);

                if (secondaryColor) {
                    document.documentElement.style.setProperty('--theme-secondary', secondaryColor);
                }
            } catch (e) {
                console.error("Error applying theme colors:", e);
            }
        };

        window.setBodyTheme = (theme) => {
            document.body.setAttribute('data-theme', theme || 'default');
        };

        window.getBodyTheme = () => {
            return document.body.getAttribute('data-theme') || 'default';
        };

        window.focusElement = (id) => {
            const el = document.getElementById(id);
            if (el) el.focus();
        };

        // Hardware Back Button Compatibility Handler
        window.handleBackNavigation = () => {
             if (window.history.length > 1) {
                 window.history.back();
                 return true;
             }
             return false;
        };

        // Listen for hardware-like keys
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
                // Potentially handle back navigation if logic dictates
            }
        });
    </script>
</body>

</html>
