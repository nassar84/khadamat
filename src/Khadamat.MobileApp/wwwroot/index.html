<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>خدمات</title>
    <base href="/" />

    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="_content/Khadamat.BlazorUI/lib/bootstrap/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="_content/Khadamat.BlazorUI/lib/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="_content/Khadamat.BlazorUI/lib/swiper/swiper-bundle.min.css" />

    <!-- App Styles -->
    <link rel="stylesheet" href="_content/Khadamat.BlazorUI/css/khadamat.css" />
    <link rel="stylesheet" href="_content/Khadamat.BlazorUI/css/app.css" />
    <link rel="stylesheet" href="Khadamat.MobileApp.styles.css" />
    <link rel="stylesheet" href="_content/Khadamat.BlazorUI/Khadamat.BlazorUI.styles.css" />

    <style>
        /* Modern Native App Feel */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background: #f8fafc;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            /* Prevent body scroll during load */
        }

        .status-bar-safe-area {
            height: env(safe-area-inset-top);
            background: white;
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 2000;
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
            z-index: 99999;
            transition: opacity 0.5s ease-out;
        }
    </style>
</head>

<body>
    <div class="status-bar-safe-area"></div>

    <div id="app"></div>

    <script src="_content/Khadamat.BlazorUI/lib/swiper/swiper-bundle.min.js"></script>
    <script>
        console.log("ANTIGRAVITY_LOG: index.html script execution started");

        window.hideLoadingScreen = () => {
            console.log("ANTIGRAVITY_LOG: hideLoadingScreen called");
            const loader = document.getElementById('loading-screen');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 500);
            }
            document.body.style.overflow = 'auto';
        };

        window.onerror = function (msg, url, line, col, error) {
            var debug = document.getElementById('debug-info');
            if (debug) debug.innerHTML += '<div style="color:red;font-size:10px">ERR: ' + msg + '</div>';
            console.error("ANTIGRAVITY_LOG_ERR: " + msg, error);
            return false;
        };

        // Helper functions required by shared Blazor components
        window.initCategoriesSlider = async (retryCount = 0) => {
            console.log("ANTIGRAVITY_LOG: initCategoriesSlider called (" + retryCount + ")");
            const el = document.querySelector('.categories-swiper');

            if (!el) {
                if (retryCount < 10) setTimeout(() => window.initCategoriesSlider(retryCount + 1), 200);
                return;
            }

            if (typeof Swiper === 'undefined') {
                console.error("Swiper missing, retrying...");
                if (retryCount < 10) setTimeout(() => window.initCategoriesSlider(retryCount + 1), 200);
                return;
            }

            try {
                new Swiper('.categories-swiper', {
                    slidesPerView: 'auto',
                    spaceBetween: 0,
                    loop: true,
                    grabCursor: true,
                    freeMode: { enabled: true, momentumBounce: false, momentumRatio: 1 },
                    speed: 3000,
                    autoplay: { delay: 0, disableOnInteraction: false, pauseOnMouseEnter: true }
                });
                console.log("ANTIGRAVITY_LOG: Swiper Success!");
            } catch (e) {
                console.error("Swiper init error", e);
            }
        };

        window.applyThemeColors = (primaryColor, secondaryColor) => {
            if (!primaryColor) return;
            try {
                document.documentElement.style.setProperty('--theme-primary', primaryColor);
                let r, g, b;
                if (primaryColor.startsWith('#') && primaryColor.length >= 7) {
                    r = parseInt(primaryColor.slice(1, 3), 16);
                    g = parseInt(primaryColor.slice(3, 5), 16);
                    b = parseInt(primaryColor.slice(5, 7), 16);
                } else { r = 99; g = 102; b = 241; }
                document.documentElement.style.setProperty('--theme-primary-rgb', `${r}, ${g}, ${b}`);
                document.documentElement.style.setProperty('--theme-glow', `rgba(${r}, ${g}, ${b}, 0.3)`);
                document.documentElement.style.setProperty('--theme-light', `rgba(${r}, ${g}, ${b}, 0.1)`);
            } catch (e) { }
        };

        window.setBodyTheme = (t) => document.body.setAttribute('data-theme', t || 'default');
        window.scrollToBottom = (id) => { const e = document.getElementById(id); if (e) e.scrollTop = e.scrollHeight; };
    </script>

    <script>
        (function () {
            var start = Date.now();
            var statusEl = document.getElementById('status-info');
            var messages = [
                { time: 0, msg: '⏳ بدء تحميل التطبيق...' },
                { time: 5, msg: '📦 تحميل إطار العمل Blazor...' },
                { time: 10, msg: '🔍 التحقق من الربط بالنظام...' },
                { time: 20, msg: '🔧 تهيئة موازنة النظام...' }
            ];
            setInterval(function () {
                var el = document.getElementById('timer-val');
                var elapsed = Math.floor((Date.now() - start) / 1000);
                if (el) el.innerText = elapsed;
                if (statusEl) {
                    var current = messages[0].msg;
                    for (var i = 0; i < messages.length; i++) {
                        if (elapsed >= messages[i].time) current = messages[i].msg;
                    }
                    statusEl.innerHTML = current;
                }
            }, 1000);
        })();
    </script>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        async function startBlazor() {
            var status = document.getElementById('status-info');
            let retry = 0;
            while (retry < 50) {
                if (window.external && window.external.receiveMessage) {
                    if (status) status.innerHTML = "🚀 بدء تشغيل المحرك...";
                    try {
                        await Blazor.start();
                        return;
                    } catch (e) {
                        if (e.message.indexOf("already started") !== -1) return;
                        throw e;
                    }
                }
                retry++;
                await new Promise(r => setTimeout(r, 100));
            }
        }
        setTimeout(startBlazor, 500);
    </script>

    <div id="blazor-error-ui">
        حدث خطأ غير متوقع.
        <a href="" class="reload">إعادة تحميل</a>
        <a class="dismiss">🗙</a>
    </div>
</body>

</html>
