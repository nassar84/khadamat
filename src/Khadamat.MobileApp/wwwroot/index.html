<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>خدمات</title>
    <base href="/" />

    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="_content/Khadamat.BlazorUI/lib/bootstrap/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <!-- App Styles -->
    <link rel="stylesheet" href="_content/Khadamat.BlazorUI/css/khadamat.css" />
    <link rel="stylesheet" href="_content/Khadamat.BlazorUI/css/app.css" />
    <link rel="stylesheet" href="Khadamat.MobileApp.styles.css" />
    <link rel="stylesheet" href="_content/Khadamat.BlazorUI/Khadamat.BlazorUI.styles.css" />

    <style>
        /* Modern Native App Feel */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background: #f8fafc;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .status-bar-safe-area {
            height: env(safe-area-inset-top);
            background: white;
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 2000;
        }
    </style>
</head>

<body>
    <div class="status-bar-safe-area"></div>

    <div id="app">
        <div
            style="position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:white;z-index:9999">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
            <div class="mt-4 fw-bold text-primary" style="font-family: 'Tajawal', sans-serif;">تحميل خدمات...</div>
            <div id="debug-info"
                style="margin-top:20px; font-size:16px; color:#000; font-weight:bold; background:rgba(255,255,255,0.95); padding:10px 20px; border-radius:10px; border:2px solid #6366f1;">
                V1.4 | <span id="timer-val">0</span>s
            </div>
            <div id="status-info"
                style="margin-top:12px; font-size:12px; color:#333; max-width:300px; text-align:center; background:rgba(255,255,255,0.8); padding:6px 12px; border-radius:6px;">
                Initializing...
            </div>
        </div>
    </div>
    <script>
        window.onerror = function (msg, url, line, col, error) {
            var debug = document.getElementById('debug-info');
            if (debug) {
                debug.innerHTML += '<div style="color:red;font-size:10px">ERR: ' + msg + '</div>';
            }
            console.error(msg, error);
            return false;
        };
        console.log("ANTIGRAVITY_LOG: index.html script execution started");
    </script>

    <script>
        (function () {
            var start = Date.now();
            var statusEl = document.getElementById('status-info');

            setInterval(function () {
                var el = document.getElementById('timer-val');
                var elapsed = Math.floor((Date.now() - start) / 1000);
                if (el) el.innerText = elapsed;

                // Update status based on time
                if (statusEl) {
                    if (elapsed < 3) statusEl.innerText = '⏳ Loading Blazor framework...';
                    else if (elapsed < 6) statusEl.innerText = '🔌 Connecting to API (10.0.2.2:5144)...';
                    else if (elapsed < 10) statusEl.innerText = '📦 Loading components...';
                    else {
                        statusEl.innerHTML = '⚠️ <strong>Taking too long!</strong><br>Check if API is running at 10.0.2.2:5144';
                        statusEl.style.color = '#dc3545';
                        statusEl.style.fontWeight = 'bold';
                    }
                }
            }, 1000);
        })();
    </script>

    <script src="_framework/blazor.webview.js"></script>
    <div id="blazor-error-ui">
        حدث خطأ غير متوقع.
        <a href="" class="reload">إعادة تحميل</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- JS Dependencies (Deferred to prevent blocking) -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>
</body>

</html>
