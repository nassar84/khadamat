    <style>
        :root {
            --primary-color: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --secondary-color: #f43f5e;
            --bg-glass: rgba(255, 255, 255, 0.7);
            --bg-glass-dark: rgba(15, 23, 42, 0.8);
            --text-main: #1e293b;
            --border-glass: rgba(255, 255, 255, 0.3);
        }

        body {
            font-family: 'Tajawal', 'Outfit', sans-serif;
            background-color: #f8fafc;
            color: var(--text-main);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        #app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .skeleton-container {
            padding: 15px;
            background-color: #f8fafc;
            min-height: 100vh;
        }

        .skeleton-shimmer {
            background: linear-gradient(90deg, #edf2f7 25%, #e2e8f0 50%, #edf2f7 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s infinite linear;
            border-radius: 8px;
        }

        @keyframes skeleton-shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .skeleton-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 10px;
        }

        .skeleton-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .skeleton-search {
            flex-grow: 1;
            height: 45px;
            border-radius: 25px;
        }

        .skeleton-marquee {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .skeleton-icon {
            width: 65px;
            height: 65px;
            border-radius: 20px;
            flex-shrink: 0;
        }

        .skeleton-hero {
            height: 160px;
            border-radius: 20px;
            margin-bottom: 30px;
            width: 100%;
        }

        .skeleton-section-title {
            margin-bottom: 15px;
        }

        .skeleton-title-box {
            width: 120px;
            height: 20px;
        }

        .skeleton-cards-row {
            display: flex;
            gap: 15px;
            overflow: hidden;
        }

        .skeleton-card {
            flex: 1;
            min-width: 250px;
            background: white;
            padding: 12px;
            border-radius: 20px;
            border: 1px solid #edf2f7;
        }

        .skeleton-card-img {
            aspect-ratio: 16/9;
            width: 100%;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .skeleton-card-line {
            height: 12px;
            margin-bottom: 8px;
        }

        .w-75 {
            width: 75%;
        }

        .w-50 {
            width: 50%;
        }
    </style>
</head>

<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="js/qrcode.min.js"></script>
    <script>
        window.shareServiceAsImage = async (elementId, qrText, fileName) => {
            const element = document.getElementById(elementId);
            if (!element) return;

            // Show element temporarily if it's hidden
            const originalDisplay = element.style.display;
            element.style.display = 'block';
            element.style.position = 'fixed';
            element.style.left = '-9999px';
            element.style.top = '0';

            // Generate QR Code
            const qrContainer = document.getElementById(elementId + '-qrcode');
            if (qrContainer) {
                qrContainer.innerHTML = '';
                new QRCode(qrContainer, {
                    text: qrText,
                    width: 100,
                    height: 100,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
                // Wait a bit for QR to render
                await new TaskWait(200);
            }

            try {
                const canvas = await html2canvas(element, {
                    useCORS: true,
                    scale: 2, // Higher quality
                    backgroundColor: null
                });

                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                const file = new File([blob], fileName + '.png', { type: 'image/png' });

                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'مشاركة الخدمة',
                        text: 'شاهد هذه الخدمة الرائعة على تطبيق وموقع خدمات'
                    });
                } else {
                    // Fallback to simple download or alert
                    const link = document.createElement('a');
                    link.download = fileName + '.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }
            } catch (err) {
                console.error('Sharing failed', err);
            } finally {
                element.style.display = originalDisplay;
                element.style.position = '';
                element.style.left = '';
            }
        };

        window.generateQRCode = (elementId, text) => {
            const el = document.getElementById(elementId);
            if (!el) return;
            el.innerHTML = "";
            
            if (typeof QRCode === 'undefined') {
                console.error("QRCode library not loaded. Make sure js/qrcode.min.js is included.");
                el.innerHTML = "<p style='color:white;font-size:10px;'>QR Code unavailable</p>";
                return;
            }

            try {
                new QRCode(el, {
                    text: text,
                    width: 128,
                    height: 128,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            } catch (e) {
                console.error("Error generating QR code:", e);
            }
            const qrImg = el.querySelector('img');
            if(qrImg) {
                qrImg.style.display = "block";
                qrImg.style.margin = "auto";
                qrImg.style.borderRadius = "8px";
            }
        };

        function TaskWait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        window.initCategoriesSlider = () => {
            const el = document.querySelector('.categories-swiper');
            if (!el) return;

            if (typeof Swiper === 'undefined') {
                console.error("Swiper library not loaded.");
                return;
            }

            // Destroy existing instance if any
            if (el.swiper) {
                try { el.swiper.destroy(true, true); } catch (e) { }
            }

            try {
                new Swiper(el, {
                    slidesPerView: 'auto',
                    spaceBetween: 25,
                    loop: false,
                    grabCursor: true,
                    speed: 5000,
                    autoplay: {
                        delay: 0,
                        disableOnInteraction: false,
                        pauseOnMouseEnter: false
                    },
                    freeMode: {
                        enabled: true,
                        momentumBounce: false,
                        momentumRatio: 1
                    },
                    observer: true,
                    observeParents: true,
                    allowTouchMove: true,
                    mousewheel: {
                        forceToAxis: true,
                    },
                    keyboard: true
                });
            } catch (e) {
                console.error("Swiper initialization failed:", e);
            }
        };

        // Drag to scroll for category marquee
        window.initCategoryDragScroll = (element) => {
            if (!element) return;

            let isDown = false;
            let startX;
            let scrollLeft;
            let velocity = 0;
            let momentumID;

            element.addEventListener('mousedown', (e) => {
                isDown = true;
                element.style.cursor = 'grabbing';
                startX = e.pageX - element.offsetLeft;
                scrollLeft = element.scrollLeft;
                cancelMomentumTracking();
            });

            element.addEventListener('mouseleave', () => {
                isDown = false;
                element.style.cursor = 'grab';
            });

            element.addEventListener('mouseup', () => {
                isDown = false;
                element.style.cursor = 'grab';
                beginMomentumTracking();
            });

            element.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - element.offsetLeft;
                const walk = (x - startX) * 2;
                const prevScrollLeft = element.scrollLeft;
                element.scrollLeft = scrollLeft - walk;
                velocity = element.scrollLeft - prevScrollLeft;
            });

            // Touch support
            element.addEventListener('touchstart', (e) => {
                isDown = true;
                startX = e.touches[0].pageX - element.offsetLeft;
                scrollLeft = element.scrollLeft;
                cancelMomentumTracking();
            });

            element.addEventListener('touchend', () => {
                isDown = false;
                beginMomentumTracking();
            });

            element.addEventListener('touchmove', (e) => {
                if (!isDown) return;
                const x = e.touches[0].pageX - element.offsetLeft;
                const walk = (x - startX) * 2;
                const prevScrollLeft = element.scrollLeft;
                element.scrollLeft = scrollLeft - walk;
                velocity = element.scrollLeft - prevScrollLeft;
            });

            function beginMomentumTracking() {
                cancelMomentumTracking();
                momentumID = requestAnimationFrame(momentumLoop);
            }

            function cancelMomentumTracking() {
                cancelAnimationFrame(momentumID);
            }

            function momentumLoop() {
                if (!element) return;
                element.scrollLeft -= velocity;
                velocity *= 0.95;
                if (Math.abs(velocity) > 0.5) {
                    momentumID = requestAnimationFrame(momentumLoop);
                }
            }
        };

        // Apply theme colors dynamically
        window.applyThemeColors = (primaryColor, secondaryColor) => {
            if (!primaryColor) return;

            try {
                document.documentElement.style.setProperty('--theme-primary', primaryColor);

                // Convert hex to RGB for glow effect
                let r, g, b;
                if (primaryColor.startsWith('#') && primaryColor.length >= 7) {
                    r = parseInt(primaryColor.slice(1, 3), 16);
                    g = parseInt(primaryColor.slice(3, 5), 16);
                    b = parseInt(primaryColor.slice(5, 7), 16);
                } else {
                    // Fallback or handle non-hex
                    r = 99; g = 102; b = 241;
                }

                document.documentElement.style.setProperty('--theme-primary-rgb', `${r}, ${g}, ${b}`);
                document.documentElement.style.setProperty('--theme-glow', `rgba(${r}, ${g}, ${b}, 0.3)`);
                document.documentElement.style.setProperty('--theme-light', `rgba(${r}, ${g}, ${b}, 0.1)`);

                if (secondaryColor) {
                    document.documentElement.style.setProperty('--theme-secondary', secondaryColor);
                }
            } catch (e) {
                console.error("Error applying theme colors:", e);
            }
        };

        // Theme helpers for Blazor interop
        window.setBodyTheme = (theme) => {
            document.body.setAttribute('data-theme', theme || 'default');
        };

        window.getBodyTheme = () => {
            return document.body.getAttribute('data-theme') || 'default';
        };

        window.focusElement = (id) => {
            const el = document.getElementById(id);
            if (el) el.focus();
        };

        window.setupHeaderClickHandler = (dotNetHelper) => {
            if (window.headerClickHandler) {
                document.removeEventListener('click', window.headerClickHandler);
            }

            window.headerClickHandler = (event) => {
                const themeToggle = document.getElementById('themeToggle');
                const userDropdown = document.getElementById('userDropdown');
                const mobileThemeToggle = document.getElementById('mobileThemeToggle');

                // Desktop Theme Menu
                if (themeToggle && !themeToggle.contains(event.target)) {
                    const themeMenu = themeToggle.querySelector('.theme-popover');
                    if (themeMenu && themeMenu.classList.contains('show')) {
                        dotNetHelper.invokeMethodAsync('CloseThemeMenu');
                    }
                }

                // Desktop User Menu
                if (userDropdown && !userDropdown.contains(event.target)) {
                    const userMenu = userDropdown.querySelector('.user-glass-menu');
                    if (userMenu && userMenu.classList.contains('show')) {
                        dotNetHelper.invokeMethodAsync('CloseUserMenu');
                    }
                }
            };

            document.addEventListener('click', window.headerClickHandler);
        };

        window.scrollToBottom = (elementId) => {
            const element = document.getElementById(elementId);
            if (element) {
                element.scrollTop = element.scrollHeight;
            }
        };

        window.hideLoadingScreen = () => {
            const container = document.getElementById('loading-container');
            if (container) {
                container.style.opacity = '0';
                setTimeout(() => {
                    container.style.display = 'none';
                }, 500);
            }
        };

        window.updateWebDetails = (title, logoUrl) => {
            if (title) document.title = title;
            if (logoUrl) {
                let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
                link.type = 'image/png';
                link.rel = 'icon';
                link.href = logoUrl;
                document.getElementsByTagName('head')[0].appendChild(link);
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
        window.shareApp = async (title, text, url) => {
            try {
                const fullText = `${text}\n${url}`;
                // Check if it's a mobile device and navigator.share is available
                if (navigator.share && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    try {
                        await navigator.share({ title, text, url });
                        return true;
                    } catch (e) {
                        if (e.name !== 'AbortError') {
                            console.error('Share failed, falling back to clipboard:', e);
                        } else {
                            return true; // User cancelled, not an error
                        }
                    }
                }
                
                // Fallback: Copy to clipboard
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(fullText);
                    alert('تم نسخ رابط الدعوة! يمكنك الآن لصقه ومشاركته مع أصدقائك.');
                    return true;
                } else {
                    // Manual selection fallback if clipboard API is not available
                    const textArea = document.createElement("textarea");
                    textArea.value = fullText;
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        alert('تم نسخ رابط الدعوة!');
                    } catch (err) {
                        console.error('Final fallback failed', err);
                        alert('رابط المشاركة: ' + url);
                    }
                    document.body.removeChild(textArea);
                    return true;
                }
            } catch (globalErr) {
                console.error('Global shareApp error:', globalErr);
                alert('عذراً، تعذر تنفيذ المشاركة حالياً.');
                return false;
            }
        };
    </script>
