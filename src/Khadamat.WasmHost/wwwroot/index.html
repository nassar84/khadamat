    <script>
        // ============================================================
        //  SHARE CARD FUNCTIONS
        //  Used by ServiceDetails.razor for capturing & sharing cards
        // ============================================================

        // Helper: fetch an image URL with CORS and convert to a data URL
        window._fetchImageAsDataUrl = async (url) => {
            try {
                const resp = await fetch(url, { mode: 'cors', credentials: 'omit' });
                if (!resp.ok) return null;
                const blob = await resp.blob();
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = () => resolve(null);
                    reader.readAsDataURL(blob);
                });
            } catch (e) {
                console.warn('[ShareCard] Fetch image failed:', url, e.message);
                return null;
            }
        };

        // Internal helper: capture an element as a data URL using a clone
        window._captureElementAsCanvas = async (elementId, qrText) => {
            const element = document.getElementById(elementId);
            if (!element) throw new Error('Element not found: ' + elementId);

            console.log('[ShareCard] Cloning element:', elementId);
            const clone = element.cloneNode(true);
            
            // Fix all images: remove onerror, add crossOrigin, ensure visible
            clone.querySelectorAll('img').forEach(img => {
                img.removeAttribute('onerror');
                img.crossOrigin = 'anonymous';
                if (img.style.display === 'none') img.style.display = '';
            });

            clone.style.position = 'fixed';
            clone.style.left = '-9999px';
            clone.style.top = '0';
            clone.style.width = '600px';
            clone.style.height = '315px';
            clone.style.transform = 'none';
            clone.style.display = 'flex';
            clone.style.flexDirection = 'column';
            clone.style.opacity = '1';
            document.body.appendChild(clone);

            // Regenerate QR in clone
            const qrId = elementId + '-qrcode';
            const qrContainer = clone.querySelector('#' + qrId);
            if (qrContainer) {
                if (typeof QRCode !== 'undefined') {
                    qrContainer.innerHTML = '';
                    try {
                        new QRCode(qrContainer, {
                            text: qrText,
                            width: 128,
                            height: 128,
                            colorDark: "#000000",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.M
                        });
                        const qrImg = qrContainer.querySelector('img');
                        if (qrImg) {
                            qrImg.style.borderRadius = "0";
                            qrImg.style.imageRendering = "pixelated";
                        }
                    } catch (qrErr) {
                        console.warn('[ShareCard] QR generation failed:', qrErr.message);
                    }
                    await new Promise(resolve => setTimeout(resolve, 400));
                } else {
                    console.warn('[ShareCard] QRCode library not loaded, skipping QR generation');
                }
            }

            // Convert all images to data URLs (bypasses CORS issues with html2canvas)
            const FALLBACK_GRAY = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAAEACAYAAABccqhmAAAABHNCSVQICAgIfAhkiAAAAAlwSFlzAAALEgAACxIB0t1+/AAAABx0RVh0U29mdHdhcmUAQWRvYmUgRmlyZXdvcmtzIENTNui8sowAAAAWdEVYdENyZWF0aW9uIFRpbWUAMTIvMTMvMjKqFc4lAAAAPUlEQVR4nO3BMQEAAADCoPVPbQ0PoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAOA3YAQAARpvJwAAAABJRU5ErkJggg==';
            const imgs = Array.from(clone.querySelectorAll('img'));
            if (imgs.length > 0) {
                console.log('[ShareCard] Converting', imgs.length, 'image(s) to data URLs...');
                const seen = {};
                await Promise.allSettled(imgs.map(async (img) => {
                    const src = img.getAttribute('src');
                    if (!src || src.startsWith('data:')) return;

                    let dataUrl = seen[src];
                    if (!dataUrl) {
                        dataUrl = await window._fetchImageAsDataUrl(src);
                        if (!dataUrl) {
                            const onerrorAttr = img.getAttribute('onerror');
                            const fallbackSrc = onerrorAttr
                                ? (onerrorAttr.match(/this\.src\s*=\s*'([^']+)'/) || [])[1]
                                : null;
                            if (fallbackSrc && fallbackSrc !== src) {
                                dataUrl = await window._fetchImageAsDataUrl(fallbackSrc);
                            }
                        }
                        if (!dataUrl) dataUrl = FALLBACK_GRAY;
                        seen[src] = dataUrl;
                    }
                    img.src = dataUrl;
                    img.removeAttribute('crossorigin');
                    img.removeAttribute('onerror');
                }));
                console.log('[ShareCard] All images converted to data URLs');
            }


            // Extra wait after image conversion for layout repaint
            await new Promise(resolve => setTimeout(resolve, 200));

            try {
                const canvas = await html2canvas(clone, {
                    useCORS: false,
                    scale: 2,
                    backgroundColor: '#ffffff',
                    logging: false,
                    allowTaint: false,
                    imageTimeout: 5000
                });
                console.log('[ShareCard] Capture success:', canvas.width, 'x', canvas.height);
                return canvas;
            } finally {
                document.body.removeChild(clone);
            }
        };

        // 1. Capture the share card and upload it to the API
        window.uploadShareCardImage = async (elementId, shareUrl, serviceId, apiBase) => {
            try {
                const canvas = await window._captureElementAsCanvas(elementId, shareUrl);
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                if (!blob) throw new Error('Blob creation failed');

                const formData = new FormData();
                formData.append('file', blob, `card_${serviceId}.png`);
                let base = apiBase || window.apiBaseUrl || window.location.origin;
                if (base.endsWith('/')) base = base.slice(0, -1);

                element.scrollLeft = scrollLeft - walk;
                velocity = element.scrollLeft - prevScrollLeft;
            });

            // Touch support
            element.addEventListener('touchstart', (e) => {
                isDown = true;
                startX = e.touches[0].pageX - element.offsetLeft;
                scrollLeft = element.scrollLeft;
                cancelMomentumTracking();
            });

            element.addEventListener('touchend', () => {
                isDown = false;
                beginMomentumTracking();
            });

            element.addEventListener('touchmove', (e) => {
                if (!isDown) return;
                const x = e.touches[0].pageX - element.offsetLeft;
                const walk = (x - startX) * 2;
                const prevScrollLeft = element.scrollLeft;
                element.scrollLeft = scrollLeft - walk;
                velocity = element.scrollLeft - prevScrollLeft;
            });

            function beginMomentumTracking() {
                cancelMomentumTracking();
                momentumID = requestAnimationFrame(momentumLoop);
            }

            function cancelMomentumTracking() {
                cancelAnimationFrame(momentumID);
            }

            function momentumLoop() {
                if (!element) return;
                element.scrollLeft -= velocity;
                velocity *= 0.95;
                if (Math.abs(velocity) > 0.5) {
                    momentumID = requestAnimationFrame(momentumLoop);
                }
            }
        };

        // Apply theme colors dynamically
        window.applyThemeColors = (primaryColor, secondaryColor) => {
            if (!primaryColor) return;

            try {
                document.documentElement.style.setProperty('--theme-primary', primaryColor);

                // Convert hex to RGB for glow effect
                let r, g, b;
                if (primaryColor.startsWith('#') && primaryColor.length >= 7) {
                    r = parseInt(primaryColor.slice(1, 3), 16);
                    g = parseInt(primaryColor.slice(3, 5), 16);
                    b = parseInt(primaryColor.slice(5, 7), 16);
                } else {
                    // Fallback or handle non-hex
                    r = 99; g = 102; b = 241;
                }

                document.documentElement.style.setProperty('--theme-primary-rgb', `${r}, ${g}, ${b}`);
                document.documentElement.style.setProperty('--theme-glow', `rgba(${r}, ${g}, ${b}, 0.3)`);
                document.documentElement.style.setProperty('--theme-light', `rgba(${r}, ${g}, ${b}, 0.1)`);

                if (secondaryColor) {
                    document.documentElement.style.setProperty('--theme-secondary', secondaryColor);
                }
            } catch (e) {
                console.error("Error applying theme colors:", e);
            }
        };

        // Theme helpers for Blazor interop
        window.setBodyTheme = (theme) => {
            document.body.setAttribute('data-theme', theme || 'default');
        };

        window.getBodyTheme = () => {
            return document.body.getAttribute('data-theme') || 'default';
        };

        window.focusElement = (id) => {
            const el = document.getElementById(id);
            if (el) el.focus();
        };

        window.setupHeaderClickHandler = (dotNetHelper) => {
            if (window.headerClickHandler) {
                document.removeEventListener('click', window.headerClickHandler);
            }

            window.headerClickHandler = (event) => {
                const themeToggle = document.getElementById('themeToggle');
                const userDropdown = document.getElementById('userDropdown');
                const mobileThemeToggle = document.getElementById('mobileThemeToggle');

                // Desktop Theme Menu
                if (themeToggle && !themeToggle.contains(event.target)) {
                    const themeMenu = themeToggle.querySelector('.theme-popover');
                    if (themeMenu && themeMenu.classList.contains('show')) {
                        dotNetHelper.invokeMethodAsync('CloseThemeMenu');
                    }
                }

                // Desktop User Menu
                if (userDropdown && !userDropdown.contains(event.target)) {
                    const userMenu = userDropdown.querySelector('.user-glass-menu');
                    if (userMenu && userMenu.classList.contains('show')) {
                        dotNetHelper.invokeMethodAsync('CloseUserMenu');
                    }
                }
            };

            document.addEventListener('click', window.headerClickHandler);
        };

        window.scrollToBottom = (elementId) => {
            const element = document.getElementById(elementId);
            if (element) {
                element.scrollTop = element.scrollHeight;
            }
        };

        window.hideLoadingScreen = () => {
            const container = document.getElementById('loading-container');
            if (container) {
                container.style.opacity = '0';
                setTimeout(() => {
                    container.style.display = 'none';
                }, 500);
            }
        };

        // Image fallback chain: tries each URL in order until one loads
        window.handleServiceImageError = (img, fallbacks) => {
            if (!img) return;
            if (!fallbacks || !fallbacks.length) {
                img.onerror = null;
                img.src = '/images/placeholders/default_service.png';
                return;
            }

            let currentIdx = img.dataset.fallbackIndex !== undefined ? parseInt(img.dataset.fallbackIndex) : 0;

            while (currentIdx < fallbacks.length) {
                const nextSrc = fallbacks[currentIdx++];
                img.dataset.fallbackIndex = currentIdx;

                if (nextSrc) {
                    const tempAnchor = document.createElement('a');
                    tempAnchor.href = nextSrc;
                    const nextAbsoluteUrl = tempAnchor.href;

                    if (img.src !== nextAbsoluteUrl) {
                        img.src = nextSrc;
                        return;
                    }
                }
            }

            img.onerror = null;
            img.src = '/images/placeholders/default_service.png';
        };

        window.updateWebDetails = (title, logoUrl) => {
            if (title) document.title = title;
            if (logoUrl) {
                let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
                link.type = 'image/png';
                link.rel = 'icon';
                link.href = logoUrl;
                document.getElementsByTagName('head')[0].appendChild(link);
            }
        };
    </script>
    <script>
        // Native share bridge for Blazor WebView / MAUI Hybrid
        window.nativeShare = async (title, text, url, imageUrl) => {
            const isNative = (navigator.userAgent && navigator.userAgent.indexOf('KhadamatNativeApp') !== -1) ||
                             window.location.search.indexOf('nativeapp=1') !== -1 || 
                             sessionStorage.getItem('nativeapp') === '1';

            const fullText = (text ? text : '') + (url ? (text ? '\n\n' : '') + url : '');

            // In native mobile app: immediately trigger MAUI native system share sheet
            if (isNative) {
                let shareUri = 'khadamat://share?title=' + encodeURIComponent(title || 'مشاركة') + '&text=' + encodeURIComponent(fullText);
                if (url) shareUri += '&url=' + encodeURIComponent(url);
                if (imageUrl) shareUri += '&image=' + encodeURIComponent(imageUrl);
                window.location.href = shareUri;
                return { success: true };
            }

            const shareData = { title: title || '', text: text || '', url: url || '' };
            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                    return { success: true };
                } catch (e) {
                    if (e.name === 'AbortError') return { success: true };
                    console.warn('navigator.share failed:', e);
                }
            }

            // Fallback: if _showShareOptions exists, show custom modal
            const displayUrl = url || '';
            if (typeof window._showShareOptions === 'function') {
                window._showShareOptions(imageUrl || null, displayUrl, fullText, null);
            }
            return { success: true };
        };

        // Open external URL or external app bridge
        window.openExternalUrl = function(url) {
            if (!url) return;

            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            const isNative = (navigator.userAgent && navigator.userAgent.indexOf('KhadamatNativeApp') !== -1) ||
                             window.location.search.indexOf('nativeapp=1') !== -1 || 
                             sessionStorage.getItem('nativeapp') === '1';

            let targetUrl = url;

            // Handle WhatsApp links
            if (targetUrl.includes('api.whatsapp.com/send') || targetUrl.includes('wa.me')) {
                let textPart = '';
                const idx = targetUrl.indexOf('text=');
                if (idx !== -1) {
                    textPart = targetUrl.substring(idx + 5);
                }
                if (isNative) {
                    window.location.href = 'khadamat://openurl?url=' + encodeURIComponent('whatsapp://send?text=' + textPart);
                    return;
                } else if (isMobile) {
                    window.location.href = 'whatsapp://send?text=' + textPart;
                    setTimeout(function() {
                        window.location.href = 'https://api.whatsapp.com/send?text=' + textPart;
                    }, 1200);
                    return;
                }
            }

            // Handle Telegram links
            if (targetUrl.includes('t.me/share/url?')) {
                const queryPart = targetUrl.substring(targetUrl.indexOf('?') + 1);
                if (isNative) {
                    window.location.href = 'khadamat://openurl?url=' + encodeURIComponent('tg://msg_url?' + queryPart);
                    return;
                } else if (isMobile) {
                    window.location.href = 'tg://msg_url?' + queryPart;
                    setTimeout(function() {
                        window.location.href = 'https://t.me/share/url?' + queryPart;
                    }, 1200);
                    return;
                }
            }

            // Handle Native App generic URLs
            if (isNative) {
                window.location.href = 'khadamat://openurl?url=' + encodeURIComponent(targetUrl);
                return;
            }

            // On mobile browser: use window.location.href instead of window.open to prevent popup blocker!
            if (isMobile) {
                window.location.href = targetUrl;
            } else {
                window.open(targetUrl, '_blank');
            }
        };

        // Intercept target="_blank" and external links inside native app WebView
        document.addEventListener('click', function(e) {
            const isNative = (navigator.userAgent && navigator.userAgent.indexOf('KhadamatNativeApp') !== -1) ||
                             window.location.search.indexOf('nativeapp=1') !== -1 || 
                             sessionStorage.getItem('nativeapp') === '1';
            if (!isNative) return;
            const a = e.target.closest('a');
            if (a && a.href) {
                const href = a.href;
                const isExternal = href.startsWith('https://wa.me') || 
                                   href.startsWith('https://api.whatsapp.com') ||
                                   href.startsWith('whatsapp:') ||
                                   href.startsWith('https://t.me') ||
                                   href.startsWith('tg:') ||
                                   href.startsWith('https://www.facebook.com/sharer') ||
                                   href.startsWith('https://facebook.com/sharer') ||
                                   href.startsWith('https://twitter.com') ||
                                   href.startsWith('https://x.com') ||
                                   href.startsWith('https://play.google.com') ||
                                   href.startsWith('market:') ||
                                   a.target === '_blank';
                if (isExternal && !href.startsWith('javascript:') && !href.startsWith('khadamat:')) {
                    e.preventDefault();
                    window.openExternalUrl(href);
                }
            }
        }, true);
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
        window.shareApp = async (title, text, url, imageUrl) => {
            try {
                const isNative = (navigator.userAgent && navigator.userAgent.indexOf('KhadamatNativeApp') !== -1) ||
                                 window.location.search.indexOf('nativeapp=1') !== -1 || 
                                 sessionStorage.getItem('nativeapp') === '1';
                const fullText = (text ? text : '') + (url ? (text ? '\n\n' : '') + url : '');
                if (isNative) {
                    let shareUri = 'khadamat://share?title=' + encodeURIComponent(title || 'دعوة لتطبيق خدماوي') + '&text=' + encodeURIComponent(fullText);
                    if (url) shareUri += '&url=' + encodeURIComponent(url);
                    if (imageUrl) shareUri += '&image=' + encodeURIComponent(imageUrl);
                    window.location.href = shareUri;
                    return true;
                }
                // Check if it's a mobile device and navigator.share is available
                if (navigator.share && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    try {
                        await navigator.share({ title, text, url });
                        return true;
                    } catch (e) {
                        if (e.name !== 'AbortError') {
                            console.error('Share failed, falling back to clipboard:', e);
                        } else {
                            return true; // User cancelled, not an error
                        }
                    }
                }
                
                // Fallback: Copy to clipboard
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(fullText);
                    alert('تم نسخ رابط الدعوة! يمكنك الآن لصقه ومشاركته مع أصدقائك.');
                    return true;
                } else {
                    // Manual selection fallback if clipboard API is not available
                    const textArea = document.createElement("textarea");
                    textArea.value = fullText;
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        alert('تم نسخ رابط الدعوة!');
                    } catch (err) {
                        console.error('Final fallback failed', err);
                        alert('رابط المشاركة: ' + url);
                    }
                    document.body.removeChild(textArea);
                    return true;
                }
            } catch (globalErr) {
                console.error('Global shareApp error:', globalErr);
                alert('عذراً، تعذر تنفيذ المشاركة حالياً.');
                return false;
            }
        };
    </script>

    <!-- Smart Pull-to-Refresh Prevention: only prevent browser pull-to-refresh when at very top -->
    <script>
        (function () {
            var _startY = 0;
            var _startEl = null;

            function getScrollableParent(el) {
                while (el && el !== document.body) {
                    var style = window.getComputedStyle(el);
                    var overflowY = style.overflowY;
                    if ((overflowY === 'auto' || overflowY === 'scroll') && el.scrollHeight > el.clientHeight) {
                        return el;
                    }
                    el = el.parentElement;
                }
                return document.scrollingElement || document.documentElement;
            }

            document.addEventListener('touchstart', function (e) {
                if (e.touches.length !== 1) return;
                _startY = e.touches[0].clientY;
                _startEl = getScrollableParent(e.target);
            }, { passive: true });

            document.addEventListener('touchmove', function (e) {
                if (!_startEl) return;
                var dy = e.touches[0].clientY - _startY;
                var scrollTop = _startEl.scrollTop;

                // ONLY block native pull-to-refresh when the element is at the very top
                // and the user is pulling DOWN. This avoids blocking normal upward scrolling.
                if (dy > 0 && scrollTop === 0) {
                    e.preventDefault();
                }
                // When scrollTop > 0 (not at top): do nothing — allow native scroll freely
            }, { passive: false });
        })();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/service-worker.js')

                        console.log('[SW] Registered successfully. Scope:', reg.scope);
                    })

                    });
            });
        }
