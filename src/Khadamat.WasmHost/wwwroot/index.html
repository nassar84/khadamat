<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>خدمات</title>
    <base href="/" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap"
        rel="stylesheet">

    <!-- UI Frameworks/Libraries -->
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.rtl.min.css" />
    <link rel="stylesheet" href="_content/Khadamat.BlazorUI/css/khadamat.css" />
    <link rel="stylesheet" href="_content/Khadamat.BlazorUI/css/app.css" />
    <link rel="stylesheet" href="_content/Khadamat.BlazorUI/lib/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="_content/Khadamat.BlazorUI/lib/swiper/swiper-bundle.min.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />
    <!-- Antigravity Update: 2026-03-18 (Fixed API Routes & Loading Overlay) -->
    <meta name="version" content="1.1.0-Fixed" />
    <link href="Khadamat.WasmHost.styles.css" rel="stylesheet" />

    <style>
        :root {
            --primary-color: #6366f1;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --secondary-color: #f43f5e;
            --bg-glass: rgba(255, 255, 255, 0.7);
            --bg-glass-dark: rgba(15, 23, 42, 0.8);
            --text-main: #1e293b;
            --border-glass: rgba(255, 255, 255, 0.3);
        }

        body {
            font-family: 'Tajawal', 'Outfit', sans-serif;
            background-color: #f8fafc;
            color: var(--text-main);
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        #app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .skeleton-container {
            padding: 15px;
            background-color: #f8fafc;
            min-height: 100vh;
        }

        .skeleton-shimmer {
            background: linear-gradient(90deg, #edf2f7 25%, #e2e8f0 50%, #edf2f7 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s infinite linear;
            border-radius: 8px;
        }

        @keyframes skeleton-shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .skeleton-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 10px;
        }

        .skeleton-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .skeleton-search {
            flex-grow: 1;
            height: 45px;
            border-radius: 25px;
        }

        .skeleton-marquee {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .skeleton-icon {
            width: 65px;
            height: 65px;
            border-radius: 20px;
            flex-shrink: 0;
        }

        .skeleton-hero {
            height: 160px;
            border-radius: 20px;
            margin-bottom: 30px;
            width: 100%;
        }

        .skeleton-section-title {
            margin-bottom: 15px;
        }

        .skeleton-title-box {
            width: 120px;
            height: 20px;
        }

        .skeleton-cards-row {
            display: flex;
            gap: 15px;
            overflow: hidden;
        }

        .skeleton-card {
            flex: 1;
            min-width: 250px;
            background: white;
            padding: 12px;
            border-radius: 20px;
            border: 1px solid #edf2f7;
        }

        .skeleton-card-img {
            aspect-ratio: 16/9;
            width: 100%;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .skeleton-card-line {
            height: 12px;
            margin-bottom: 8px;
        }

        .w-75 {
            width: 75%;
        }

        .w-50 {
            width: 50%;
        }
    </style>
</head>

<body>
    <div id="app"></div>

    <div id="loading-container"
        style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: #f8fafc; z-index: 99999; transition: opacity 0.5s ease-out;">
        <div style="text-align: center;">
            <div class="pulsing-logo"
                style="width: 120px; height: 120px; margin: 0 auto 30px; position: relative; display: flex; align-items: center; justify-content: center;">
                <img src="logo.png" alt="Logo"
                    style="width: 100%; height: 100%; object-fit: contain; position: relative; z-index: 2;"
                    onerror="this.src='favicon.png'; this.style.width='64px'; this.style.height='64px';" />
                <div
                    style="position: absolute; width: 100%; height: 100%; background: var(--primary-color, #6366f1); border-radius: 50%; opacity: 0.15; filter: blur(20px); animation: logoGlow 2s infinite ease-in-out;">
                </div>
            </div>
            <div
                style="width: 180px; height: 6px; background: #eaeef4; border-radius: 10px; overflow: hidden; margin: 0 auto; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);">
                <div
                    style="width: 40%; height: 100%; border-radius: 10px; background: var(--primary-gradient, linear-gradient(135deg, #6366f1 0%, #4f46e5 100%)); animation: loadingBarSync 1.5s infinite ease-in-out;">
                </div>
            </div>
            <p style="margin-top: 15px; font-weight: 500; color: #64748b; font-size: 0.9rem; letter-spacing: 0.05em;">
                جاري التحميل...</p>
        </div>
        <style>
            .pulsing-logo img {
                animation: pulseFloat 3s infinite ease-in-out;
            }

            @keyframes pulseFloat {

                0%,
                100% {
                    transform: translateY(0) scale(1.02);
                }

                50% {
                    transform: translateY(-10px) scale(1);
                }
            }

            @keyframes logoGlow {

                0%,
                100% {
                    transform: scale(0.8);
                    opacity: 0.1;
                }

                50% {
                    transform: scale(1.3);
                    opacity: 0.3;
                }
            }

            @keyframes loadingBarSync {
                0% {
                    transform: translateX(-100%);
                }

                100% {
                    transform: translateX(200%);
                }
            }
        </style>
    </div>




    <div id="blazor-error-ui">
        حدث خطأ غير متوقع.
        <a href="." class="reload">إعادة تحميل</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="_content/Khadamat.BlazorUI/lib/swiper/swiper-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        window.shareServiceAsImage = async (elementId, qrText, fileName) => {
            const element = document.getElementById(elementId);
            if (!element) return;

            // Show element temporarily if it's hidden
            const originalDisplay = element.style.display;
            element.style.display = 'block';
            element.style.position = 'fixed';
            element.style.left = '-9999px';
            element.style.top = '0';

            // Generate QR Code
            const qrContainer = document.getElementById(elementId + '-qrcode');
            if (qrContainer) {
                qrContainer.innerHTML = '';
                new QRCode(qrContainer, {
                    text: qrText,
                    width: 100,
                    height: 100,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
                // Wait a bit for QR to render
                await new TaskWait(200);
            }

            try {
                const canvas = await html2canvas(element, {
                    useCORS: true,
                    scale: 2, // Higher quality
                    backgroundColor: null
                });

                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                const file = new File([blob], fileName + '.png', { type: 'image/png' });

                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'مشاركة الخدمة',
                        text: 'شاهد هذه الخدمة الرائعة على تطبيق وموقع خدمات'
                    });
                } else {
                    // Fallback to simple download or alert
                    const link = document.createElement('a');
                    link.download = fileName + '.png';
                    link.href = canvas.toDataValue('image/png');
                    link.click();
                }
            } catch (err) {
                console.error('Sharing failed', err);
            } finally {
                element.style.display = originalDisplay;
                element.style.position = '';
                element.style.left = '';
            }
        };

        function TaskWait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        window.initCategoriesSlider = () => {
            const el = document.querySelector('.categories-swiper');
            if (!el) return;

            if (typeof Swiper === 'undefined') {
                console.error("Swiper library not loaded.");
                return;
            }

            // Destroy existing instance if any
            if (el.swiper) {
                try { el.swiper.destroy(true, true); } catch (e) { }
            }

            try {
                new Swiper(el, {
                    slidesPerView: 'auto',
                    spaceBetween: 25,
                    loop: false,
                    grabCursor: true,
                    speed: 5000,
                    autoplay: {
                        delay: 0,
                        disableOnInteraction: false,
                        pauseOnMouseEnter: false
                    },
                    freeMode: {
                        enabled: true,
                        momentumBounce: false,
                        momentumRatio: 1
                    },
                    observer: true,
                    observeParents: true,
                    allowTouchMove: true,
                    mousewheel: {
                        forceToAxis: true,
                    },
                    keyboard: true
                });
            } catch (e) {
                console.error("Swiper initialization failed:", e);
            }
        };

        // Drag to scroll for category marquee
        window.initCategoryDragScroll = (element) => {
            if (!element) return;

            let isDown = false;
            let startX;
            let scrollLeft;
            let velocity = 0;
            let momentumID;

            element.addEventListener('mousedown', (e) => {
                isDown = true;
                element.style.cursor = 'grabbing';
                startX = e.pageX - element.offsetLeft;
                scrollLeft = element.scrollLeft;
                cancelMomentumTracking();
            });

            element.addEventListener('mouseleave', () => {
                isDown = false;
                element.style.cursor = 'grab';
            });

            element.addEventListener('mouseup', () => {
                isDown = false;
                element.style.cursor = 'grab';
                beginMomentumTracking();
            });

            element.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - element.offsetLeft;
                const walk = (x - startX) * 2;
                const prevScrollLeft = element.scrollLeft;
                element.scrollLeft = scrollLeft - walk;
                velocity = element.scrollLeft - prevScrollLeft;
            });

            // Touch support
            element.addEventListener('touchstart', (e) => {
                isDown = true;
                startX = e.touches[0].pageX - element.offsetLeft;
                scrollLeft = element.scrollLeft;
                cancelMomentumTracking();
            });

            element.addEventListener('touchend', () => {
                isDown = false;
                beginMomentumTracking();
            });

            element.addEventListener('touchmove', (e) => {
                if (!isDown) return;
                const x = e.touches[0].pageX - element.offsetLeft;
                const walk = (x - startX) * 2;
                const prevScrollLeft = element.scrollLeft;
                element.scrollLeft = scrollLeft - walk;
                velocity = element.scrollLeft - prevScrollLeft;
            });

            function beginMomentumTracking() {
                cancelMomentumTracking();
                momentumID = requestAnimationFrame(momentumLoop);
            }

            function cancelMomentumTracking() {
                cancelAnimationFrame(momentumID);
            }

            function momentumLoop() {
                if (!element) return;
                element.scrollLeft -= velocity;
                velocity *= 0.95;
                if (Math.abs(velocity) > 0.5) {
                    momentumID = requestAnimationFrame(momentumLoop);
                }
            }
        };

        // Apply theme colors dynamically
        window.applyThemeColors = (primaryColor, secondaryColor) => {
            if (!primaryColor) return;

            try {
                document.documentElement.style.setProperty('--theme-primary', primaryColor);

                // Convert hex to RGB for glow effect
                let r, g, b;
                if (primaryColor.startsWith('#') && primaryColor.length >= 7) {
                    r = parseInt(primaryColor.slice(1, 3), 16);
                    g = parseInt(primaryColor.slice(3, 5), 16);
                    b = parseInt(primaryColor.slice(5, 7), 16);
                } else {
                    // Fallback or handle non-hex
                    r = 99; g = 102; b = 241;
                }

                document.documentElement.style.setProperty('--theme-primary-rgb', `${r}, ${g}, ${b}`);
                document.documentElement.style.setProperty('--theme-glow', `rgba(${r}, ${g}, ${b}, 0.3)`);
                document.documentElement.style.setProperty('--theme-light', `rgba(${r}, ${g}, ${b}, 0.1)`);

                if (secondaryColor) {
                    document.documentElement.style.setProperty('--theme-secondary', secondaryColor);
                }
            } catch (e) {
                console.error("Error applying theme colors:", e);
            }
        };

        // Theme helpers for Blazor interop
        window.setBodyTheme = (theme) => {
            document.body.setAttribute('data-theme', theme || 'default');
        };

        window.getBodyTheme = () => {
            return document.body.getAttribute('data-theme') || 'default';
        };

        window.focusElement = (id) => {
            const el = document.getElementById(id);
            if (el) el.focus();
        };

        window.setupHeaderClickHandler = (dotNetHelper) => {
            if (window.headerClickHandler) {
                document.removeEventListener('click', window.headerClickHandler);
            }

            window.headerClickHandler = (event) => {
                const themeToggle = document.getElementById('themeToggle');
                const userDropdown = document.getElementById('userDropdown');
                const mobileThemeToggle = document.getElementById('mobileThemeToggle');

                // Desktop Theme Menu
                if (themeToggle && !themeToggle.contains(event.target)) {
                    const themeMenu = themeToggle.querySelector('.theme-popover');
                    if (themeMenu && themeMenu.classList.contains('show')) {
                        dotNetHelper.invokeMethodAsync('CloseThemeMenu');
                    }
                }

                // Desktop User Menu
                if (userDropdown && !userDropdown.contains(event.target)) {
                    const userMenu = userDropdown.querySelector('.user-glass-menu');
                    if (userMenu && userMenu.classList.contains('show')) {
                        dotNetHelper.invokeMethodAsync('CloseUserMenu');
                    }
                }
            };

            document.addEventListener('click', window.headerClickHandler);
        };

        window.scrollToBottom = (elementId) => {
            const element = document.getElementById(elementId);
            if (element) {
                element.scrollTop = element.scrollHeight;
            }
        };

        window.hideLoadingScreen = () => {
            const container = document.getElementById('loading-container');
            if (container) {
                container.style.opacity = '0';
                setTimeout(() => {
                    container.style.display = 'none';
                }, 500);
            }
        };

        window.updateWebDetails = (title, logoUrl) => {
            if (title) document.title = title;
            if (logoUrl) {
                let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
                link.type = 'image/png';
                link.rel = 'icon';
                link.href = logoUrl;
                document.getElementsByTagName('head')[0].appendChild(link);
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
        window.shareApp = async (title, text, url) => {
            const fullText = `${text}\n${url}`;
            if (navigator.share && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                try {
                    await navigator.share({ title, text, url });
                    return true;
                } catch (e) {
                    if (e.name !== 'AbortError') console.error('Share failed:', e);
                }
            }
            // Fallback: Copy to clipboard
            try {
                await navigator.clipboard.writeText(fullText);
                alert('تم نسخ رابط الدعوة! يمكنك الآن لصقه ومشاركته مع أصدقائك.');
                return true;
            } catch (err) {
                console.error('Clipboard copy failed:', err);
                return false;
            }
        };
    </script>
</body>

</html>
