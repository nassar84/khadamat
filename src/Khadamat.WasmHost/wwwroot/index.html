    <!-- ✅ MOBILE BRIDGE: Capture URL query params into sessionStorage BEFORE Blazor boots -->
    <script>
        (function () {
            try {
                var params = new URLSearchParams(window.location.search);

                // ── 1. Detect version change & clear Service Worker cache ──
                var newVersion = params.get('_v');
                if (newVersion) {
                    var storedVersion = sessionStorage.getItem('app_version');
                    if (storedVersion !== newVersion) {
                        sessionStorage.setItem('app_version', newVersion);
                        // Clear all SW caches to prevent stale Blazor files from crashing the app
                        if ('caches' in window) {
                            caches.keys().then(function (names) {
                                names.forEach(function (name) {
                                    caches.delete(name);
                                    console.log('[MobileBridge] Cleared cache:', name);
                                });
                            });
                        }
                        // Unregister old service workers on version change
                        if ('serviceWorker' in navigator) {
                            navigator.serviceWorker.getRegistrations().then(function (registrations) {
                                registrations.forEach(function (reg) {
                                    reg.unregister();
                                    console.log('[MobileBridge] Unregistered SW:', reg.scope);
                                });
                            });
                        }
                    }
                }

                // ── 2. Save api_url so Blazor can synchronize API calls ──
                var apiUrl = params.get('api_url');
                if (apiUrl) {
                    sessionStorage.setItem('cfg_api_url', decodeURIComponent(apiUrl));
                    console.log('[MobileBridge] api_url captured:', decodeURIComponent(apiUrl));
                }
                // Save nativeapp flag
                if (params.get('nativeapp') === '1') {
                    sessionStorage.setItem('nativeapp', '1');
                }
                // Save redirect route for deep linking
                var redirect = params.get('redirect');
                if (redirect) {
                    sessionStorage.setItem('cfg_redirect', decodeURIComponent(redirect));
                }
                // Save theme
                var theme = params.get('theme');
                if (theme) {
                    sessionStorage.setItem('cfg_theme', theme);
                }
            } catch (e) {
                console.warn('[MobileBridge] Failed to capture params:', e.message);
            }
        })();
    </script>

    <script>
        // ============================================================
        //  SHARE CARD FUNCTIONS
        //  Used by ServiceDetails.razor for capturing & sharing cards
        // ============================================================

        // Helper: fetch an image URL with CORS and convert to a data URL
        window._fetchImageAsDataUrl = async (url) => {
            try {
                const resp = await fetch(url, { mode: 'cors', credentials: 'omit' });
                if (!resp.ok) return null;
                const blob = await resp.blob();
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = () => resolve(null);
                    reader.readAsDataURL(blob);
                });
            } catch (e) {
                console.warn('[ShareCard] Fetch image failed:', url, e.message);
                return null;
            }
        };

        // Internal helper: capture an element as a data URL using a clone
        window._captureElementAsCanvas = async (elementId, qrText) => {
            const element = document.getElementById(elementId);
            if (!element) throw new Error('Element not found: ' + elementId);

            console.log('[ShareCard] Cloning element:', elementId);

            // Get natural rendered size BEFORE cloning
            const rect = element.getBoundingClientRect();
            let captureWidth = Math.max(rect.width, 600);

            const clone = element.cloneNode(true);
            
            // Fix all images: remove onerror, add crossOrigin, ensure visible
            clone.querySelectorAll('img').forEach(img => {
                img.removeAttribute('onerror');
                img.crossOrigin = 'anonymous';
                if (img.style.display === 'none') img.style.display = '';
            });

            clone.style.position = 'fixed';
            clone.style.left = '-9999px';
            clone.style.top = '0';
            clone.style.transform = 'none';
            clone.style.zIndex = '-1';
            clone.style.display = 'block';
            clone.style.opacity = '1';
            clone.style.overflow = 'visible';

            // Enforce perfect 1.91:1 aspect ratio (764x400) for service-share-wrapper to prevent Facebook cropping
            if (elementId === 'service-share-wrapper') {
                captureWidth = 764;
                clone.style.width = '764px';
                clone.style.height = '400px';
                clone.style.minHeight = '400px';
                clone.style.maxHeight = '400px';
                clone.style.boxSizing = 'border-box';

                // Find card inside clone and set to 764x315
                const card = clone.querySelector('#service-share-card');
                if (card) {
                    card.style.width = '764px';
                    card.style.minWidth = '764px';
                    card.style.maxWidth = '764px';
                    card.style.height = '315px';
                    card.style.minHeight = '315px';
                    card.style.maxHeight = '315px';
                    card.style.boxSizing = 'border-box';
                }

                // Find promo box inside clone and set to 764x85
                const promoBox = clone.lastElementChild;
                if (promoBox && promoBox !== card) {
                    promoBox.style.width = '764px';
                    promoBox.style.height = '85px';
                    promoBox.style.minHeight = '85px';
                    promoBox.style.maxHeight = '85px';
                    promoBox.style.boxSizing = 'border-box';
                    promoBox.style.padding = '8px 16px';
                    promoBox.style.display = 'flex';
                    promoBox.style.alignItems = 'center';
                }
            } else {
                clone.style.width = captureWidth + 'px';
                clone.style.height = 'auto';
                clone.style.minHeight = '315px';
            }

            // Reset preview scaler heights and scales inside the clone to capture full size and full quality
            clone.querySelectorAll('.share-preview-scaler').forEach(s => {
                s.style.height = 'auto';
                s.style.overflow = 'visible';
                s.style.display = 'block';
            });
            clone.querySelectorAll('.share-capture-card').forEach(c => {
                c.style.transform = 'none';
                c.style.webkitTransform = 'none';
            });
            
            // Optimize font smoothing for cleaner text rendering
            clone.style.textRendering = 'optimizeLegibility';
            clone.style.webkitFontSmoothing = 'antialiased';
            clone.style.mozOsxFontSmoothing = 'grayscale';

            document.body.appendChild(clone);

            // Wait for clone layout to stabilize
            await new Promise(resolve => setTimeout(resolve, 100));

            // Regenerate QR in clone (search by id inside clone)
            const qrContainer = clone.querySelector('#service-share-card-qrcode');
            if (qrContainer && typeof QRCode !== 'undefined') {
                qrContainer.innerHTML = '';
                try {
                    new QRCode(qrContainer, {
                        text: qrText,
                        width: 128,
                        height: 128,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                } catch (qrErr) {
                    console.warn('[ShareCard] QR generation failed:', qrErr.message);
                }
                await new Promise(resolve => setTimeout(resolve, 400));
            }

            // Convert all images to data URLs (bypasses CORS issues with html2canvas)
            const FALLBACK_GRAY = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';
            const imgs = Array.from(clone.querySelectorAll('img'));
            if (imgs.length > 0) {
                console.log('[ShareCard] Converting', imgs.length, 'image(s) to data URLs...');
                const seen = {};
                await Promise.allSettled(imgs.map(async (img) => {
                    const src = img.getAttribute('src');
                    if (!src || src.startsWith('data:')) return;

                    let dataUrl = seen[src];
                    if (!dataUrl) {
                        dataUrl = await window._fetchImageAsDataUrl(src);
                        if (!dataUrl) dataUrl = FALLBACK_GRAY;
                        seen[src] = dataUrl;
                    }
                    img.src = dataUrl;
                    img.removeAttribute('crossorigin');
                    img.removeAttribute('onerror');
                }));
                console.log('[ShareCard] All images converted to data URLs');
            }

            // Extra wait after image conversion for layout repaint
            await new Promise(resolve => setTimeout(resolve, 200));

            try {
                const canvas = await html2canvas(clone, {
                    useCORS: true,
                    allowTaint: true,
                    scale: 2,
                    backgroundColor: '#ffffff',
                    logging: false,
                    imageTimeout: 8000,
                    width: captureWidth,
                    windowWidth: captureWidth
                });
                console.log('[ShareCard] Capture success:', canvas.width, 'x', canvas.height);
                return canvas;
            } finally {
                if (clone.parentNode) document.body.removeChild(clone);
            }
        };

        // 1. Capture the share card and upload it to the API
        window.uploadShareCardImage = async (elementId, shareUrl, serviceId) => {
            try {
                const canvas = await window._captureElementAsCanvas(elementId, shareUrl);
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));
                if (!blob) throw new Error('Blob creation failed');

                const formData = new FormData();
                formData.append('file', blob, `card_${serviceId}.jpg`);
                const uploadUrl = `${window.location.origin}/share/service/${serviceId}/image`;
                const resp = await fetch(uploadUrl, { method: 'POST', body: formData });
                if (resp.ok) {
                    console.log('[ShareCard] Card uploaded successfully for service', serviceId);
                } else {
                    console.warn('[ShareCard] Upload failed:', resp.status, await resp.text());
                }
            } catch (ex) {
                console.warn('[ShareCard] uploadShareCardImage error:', ex.message);
            }
        };

        // 2. Capture card and return data URL (for preview in modal)
        window.captureServiceCardAsImage = async (elementId, shareUrl) => {
            try {
                const canvas = await window._captureElementAsCanvas(elementId, shareUrl);
                return canvas.toDataURL('image/png');
            } catch (ex) {
                console.error('[ShareCard] captureServiceCardAsImage error:', ex.message);
                return null;
            }
        };

        // 3. Download card as image file
        window.shareServiceAsImage = async (elementId, shareUrl, fileName) => {
            try {
                const canvas = await window._captureElementAsCanvas(elementId, shareUrl);
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = (fileName || 'khadamat_service') + '.png';
                a.click();
            } catch (ex) {
                console.error('[ShareCard] shareServiceAsImage error:', ex.message);
            }
        };

        // 4. Download card image (alias)
        window.downloadServiceCard = async (elementId, shareUrl, fileName) => {
            await window.shareServiceAsImage(elementId, shareUrl, fileName);
        };

        // 5. Native share on mobile or custom share dialog on desktop
        window.shareCardWithPlatform = async (elementId, shareUrl, fileName, shareText) => {
            let dataUrl = null;
            let file = null;

            try {
                const canvas = await window._captureElementAsCanvas(elementId, shareUrl);
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                if (blob) {
                    dataUrl = canvas.toDataURL('image/png');
                    file = new File([blob], (fileName || 'khadamat_service') + '.png', { type: 'image/png' });
                }
            } catch (err) {
                console.warn('[ShareCard] Canvas capture failed, falling back to text-only share:', err.message);
            }

            // Try native share only on mobile devices where gesture context survives
            if (navigator.share && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                try {
                    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ title: 'خدماوي', text: shareText || '', files: [file] });
                    } else {
                        await navigator.share({ title: 'خدماوي', text: shareText || '', url: shareUrl });
                    }
                    return 'shared';
                } catch (e) {
                    if (e.name === 'AbortError') return 'cancelled';
                    console.warn('[ShareCard] Native share failed, falling back to custom dialog:', e.message);
                }
            }

            // Desktop or fallback: custom bottom-sheet share dialog
            try {
                window._showShareOptions(dataUrl, shareUrl, shareText, fileName);
            } catch (err) {
                console.error('[ShareCard] Share dialog failed:', err.message);
                window.open(shareUrl, '_blank');
            }
            return 'dialog';
        };

        // Custom bottom-sheet share dialog (modal fallback for desktop or native failure)
        window._showShareOptions = (imageDataUrl, shareUrl, shareText, fileName) => {
            try {
                const existing = document.getElementById('khadamat-share-dialog');
                if (existing) existing.remove();

                const encodedText = encodeURIComponent(shareText || shareUrl);
                const encodedUrl  = encodeURIComponent(shareUrl);

                const dialog = document.createElement('div');
                dialog.id = 'khadamat-share-dialog';

                const imgHtml = imageDataUrl ? `<img src="${imageDataUrl}" style="width:100%;border-radius:14px;margin-bottom:18px;box-shadow:0 6px 20px rgba(0,0,0,0.12);" />` : '';
                const downloadBtnHtml = imageDataUrl ? `
                    <button id="ksd-download-btn" style="width:100%;padding:14px;background:linear-gradient(135deg,#6366f1 0%,#4f46e5 100%);color:white;border:none;border-radius:14px;font-family:'Tajawal',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:10px;box-shadow:0 4px 12px rgba(99,102,241,0.35);">
                        📥 تحميل البطاقة كصورة
                    </button>` : '';

                dialog.innerHTML = `
                    <div id="khadamat-share-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:999999;display:flex;align-items:flex-end;justify-content:center;animation:ksdo-in 0.25s ease;">
                        <div onclick="event.stopPropagation()" style="background:white;border-radius:28px 28px 0 0;padding:24px 20px 36px;width:100%;max-width:560px;font-family:'Tajawal',sans-serif;direction:rtl;animation:ksds-in 0.3s cubic-bezier(.4,0,.2,1);">
                            <div style="width:44px;height:5px;background:#e2e8f0;border-radius:3px;margin:0 auto 18px;"></div>
                            <p style="font-weight:800;font-size:1.1rem;color:#1e293b;margin:0 0 14px;text-align:center;">🔗 شارك الخدمة</p>
                            ${imgHtml}
                            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;">
                                <a href="https://wa.me/?text=${encodedText}" target="_blank" style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;background:#dcfce7;border-radius:16px;text-decoration:none;color:#166534;font-size:0.78rem;font-weight:700;">

        window.generateQRCode = (elementId, text) => {
            console.log('[QR] Generating QR Code for:', text);
            const el = document.getElementById(elementId);
            if (!el) { console.warn('[QR] Element not found:', elementId); return; }
            if (typeof QRCode === 'undefined') { console.warn('[QR] QRCode library not loaded yet'); return; }
            el.innerHTML = "";
            try {
                new QRCode(el, {
                    text: text,
                    width: 128,
                    height: 128,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            } catch (e) {
                console.error('[QR] Error generating QR code:', e);
                return;
            }
            const qrImg = el.querySelector('img');
            if (qrImg) {
                qrImg.style.display = "block";
                qrImg.style.margin = "auto";
                qrImg.style.borderRadius = "8px";
            }

        function TaskWait(ms) {

        window.initCategoriesSlider = () => {
            const el = document.querySelector('.categories-swiper');
            if (!el) return;

            if (typeof Swiper === 'undefined') {
                console.error("Swiper library not loaded.");
                return;
            }

            // Destroy existing instance if any
            if (el.swiper) {
                try { el.swiper.destroy(true, true); } catch (e) { }
            }

            try {
                new Swiper(el, {
                    slidesPerView: 'auto',
                    spaceBetween: 25,
                    loop: false,
                    grabCursor: true,
                    speed: 5000,
                    autoplay: {
                        delay: 0,
                        disableOnInteraction: false,
                        pauseOnMouseEnter: false
                    },
                    freeMode: {
                        enabled: true,
                        momentumBounce: false,
                        momentumRatio: 1
                    },
                    observer: true,
                    observeParents: true,
                    allowTouchMove: true,
                    mousewheel: {
                        forceToAxis: true,
                    },
                    keyboard: true
                });
            } catch (e) {
                console.error("Swiper initialization failed:", e);
            }
        };

        // Drag to scroll for category marquee
        window.initCategoryDragScroll = (element) => {
            if (!element) return;

            let isDown = false;
            let startX;
            let scrollLeft;
            let velocity = 0;
            let momentumID;

            element.addEventListener('mousedown', (e) => {
                isDown = true;
                element.style.cursor = 'grabbing';
                startX = e.pageX - element.offsetLeft;
                scrollLeft = element.scrollLeft;
                cancelMomentumTracking();
            });

            element.addEventListener('mouseleave', () => {
                isDown = false;
                element.style.cursor = 'grab';
            });

            element.addEventListener('mouseup', () => {
                isDown = false;
                element.style.cursor = 'grab';
                beginMomentumTracking();
            });

            element.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - element.offsetLeft;
                const walk = (x - startX) * 2;
                const prevScrollLeft = element.scrollLeft;
                element.scrollLeft = scrollLeft - walk;
                velocity = element.scrollLeft - prevScrollLeft;
            });

            // Touch support
            element.addEventListener('touchstart', (e) => {
                isDown = true;
                startX = e.touches[0].pageX - element.offsetLeft;
                scrollLeft = element.scrollLeft;
                cancelMomentumTracking();
            });

            element.addEventListener('touchend', () => {
                isDown = false;
                beginMomentumTracking();
            });

            element.addEventListener('touchmove', (e) => {
                if (!isDown) return;
                const x = e.touches[0].pageX - element.offsetLeft;
                const walk = (x - startX) * 2;
                const prevScrollLeft = element.scrollLeft;
                element.scrollLeft = scrollLeft - walk;
                velocity = element.scrollLeft - prevScrollLeft;
            });

            function beginMomentumTracking() {
                cancelMomentumTracking();
                momentumID = requestAnimationFrame(momentumLoop);
            }

            function cancelMomentumTracking() {
                cancelAnimationFrame(momentumID);
            }

            function momentumLoop() {
                if (!element) return;
                element.scrollLeft -= velocity;
                velocity *= 0.95;
                if (Math.abs(velocity) > 0.5) {
                    momentumID = requestAnimationFrame(momentumLoop);
                }
            }
        };

        // Apply theme colors dynamically
        window.applyThemeColors = (primaryColor, secondaryColor) => {
            if (!primaryColor) return;

            try {
                document.documentElement.style.setProperty('--theme-primary', primaryColor);

                // Convert hex to RGB for glow effect
                let r, g, b;
                if (primaryColor.startsWith('#') && primaryColor.length >= 7) {
                    r = parseInt(primaryColor.slice(1, 3), 16);
                    g = parseInt(primaryColor.slice(3, 5), 16);
                    b = parseInt(primaryColor.slice(5, 7), 16);
                } else {
                    // Fallback or handle non-hex
                    r = 99; g = 102; b = 241;
                }

                document.documentElement.style.setProperty('--theme-primary-rgb', `${r}, ${g}, ${b}`);
                document.documentElement.style.setProperty('--theme-glow', `rgba(${r}, ${g}, ${b}, 0.3)`);
                document.documentElement.style.setProperty('--theme-light', `rgba(${r}, ${g}, ${b}, 0.1)`);

                if (secondaryColor) {
                    document.documentElement.style.setProperty('--theme-secondary', secondaryColor);
                }
            } catch (e) {
                console.error("Error applying theme colors:", e);

                // Desktop Theme Menu
                if (themeToggle && !themeToggle.contains(event.target)) {
                    const themeMenu = themeToggle.querySelector('.theme-popover');
                    if (themeMenu && themeMenu.classList.contains('show')) {
                        dotNetHelper.invokeMethodAsync('CloseThemeMenu');
                    }
                }

                // Desktop User Menu

                    if (userMenu && userMenu.classList.contains('show')) {
                        dotNetHelper.invokeMethodAsync('CloseUserMenu');

                }
            };

            document.addEventListener('click', window.headerClickHandler);
        };

        window.scrollToBottom = (elementId) => {

        window.hideLoadingScreen = () => {

            if (container) {
                container.style.opacity = '0';
                setTimeout(() => {
                    container.style.display = 'none';
                }, 500);
            }
        };

        // Image fallback chain: tries each URL in order until one loads
        window.handleServiceImageError = (img, fallbacks) => {
            if (!img) return;
            if (!fallbacks || !fallbacks.length) {
                img.onerror = null;
                img.src = '/images/placeholders/default_service.png';
                return;
            }

            let currentIdx = img.dataset.fallbackIndex !== undefined ? parseInt(img.dataset.fallbackIndex) : 0;

            while (currentIdx < fallbacks.length) {
                const nextSrc = fallbacks[currentIdx++];
                img.dataset.fallbackIndex = currentIdx;

                if (nextSrc) {
                    const tempAnchor = document.createElement('a');
                    tempAnchor.href = nextSrc;
                    const nextAbsoluteUrl = tempAnchor.href;

                    if (img.src !== nextAbsoluteUrl) {
                        img.src = nextSrc;
                        return;
                    }
                }
            }

            img.onerror = null;
            img.src = '/images/placeholders/default_service.png';
        };

        window.updateWebDetails = (title, logoUrl) => {
            if (title) document.title = title;
            if (logoUrl) {
                let link = document.querySelector("link[rel*='icon']") || document.createElement('link');
                link.type = 'image/png';
                link.rel = 'icon';
                link.href = logoUrl;
                document.getElementsByTagName('head')[0].appendChild(link);
            }
        };
    </script>
    <script>
        // Native share bridge for Blazor WebView / MAUI Hybrid
        window.nativeShare = async (title, text, url) => {
            const shareData = { title: title || '', text: text || '', url: url || '' };
            // First try the Web Share API (works in modern Android WebViews with user gesture)
            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                    return { success: true };
                } catch (e) {
                    if (e.name === 'AbortError') return { success: true };
                    console.warn('navigator.share failed:', e);
                }
            }
            // Fallback: try deep-link to native MAUI share handler
            try {
                const query = 'title=' + encodeURIComponent(title || '') + '&text=' + encodeURIComponent(text || '');
                if (url) shareData.text = (text ? text + '\n' : '') + url;
                const shareUrl = 'khadamat://share?' + query;
                // Use location.href change which triggers WebView Navigating event
                window.location.href = shareUrl;
                return { success: true };
            } catch (e) {
                console.error('Deep-link share failed:', e);
                return { success: false, error: e.message };
            }
        };
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
        window.shareApp = async (title, text, url) => {
            try {
                const fullText = `${text}\n${url}`;
                // Check if it's a mobile device and navigator.share is available
                if (navigator.share && /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    try {
                        await navigator.share({ title, text, url });
                        return true;
                    } catch (e) {
                        if (e.name !== 'AbortError') {
                            console.error('Share failed, falling back to clipboard:', e);
                        } else {
                            return true; // User cancelled, not an error
                        }
                    }
                }
                
                // Fallback: Copy to clipboard
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(fullText);
                    alert('تم نسخ رابط الدعوة! يمكنك الآن لصقه ومشاركته مع أصدقائك.');
                    return true;
                } else {
                    // Manual selection fallback if clipboard API is not available
                    const textArea = document.createElement("textarea");
                    textArea.value = fullText;
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        alert('تم نسخ رابط الدعوة!');
                    } catch (err) {
                        console.error('Final fallback failed', err);
                        alert('رابط المشاركة: ' + url);
                    }
                    document.body.removeChild(textArea);
                    return true;
                }
            } catch (globalErr) {
                console.error('Global shareApp error:', globalErr);
                alert('عذراً، تعذر تنفيذ المشاركة حالياً.');
                return false;
            }
        };
    </script>
